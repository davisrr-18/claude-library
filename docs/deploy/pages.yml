# INATIVO: este arquivo NÃO está em .github/workflows/ de propósito. O plano gratuito do GitHub não permite Pages em
# repositório privado (a API responde 422), então ativo ele falharia a cada push. Para ativar: torne o Pages
# disponível (plano pago ou repositório público) e mova para .github/workflows/pages.yml.
#
# Publica o site no GitHub Pages a cada push em main, DEPOIS de os testes e a verificação de conteúdo passarem.
# Só uma lista de permissão vai para o ar (index.html, css/, js/, vendor/, content/); tests/, docs/, tools/,
# scripts/ e .git nunca. O site fica público para quem tiver a URL, mesmo com o repositório privado.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run check

  publicar:
    needs: verificar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Montar o site (somente a lista de permissão)
        run: |
          mkdir _site
          cp -r index.html css js vendor content _site/
          touch _site/.nojekyll
          echo "Arquivos publicados:"
          (cd _site && find . -type f | sort | sed 's|^\./||')
          extra="$(ls -A _site | grep -vxE 'index.html|css|js|vendor|content|\.nojekyll' || true)"
          if [ -n "$extra" ]; then echo "ERRO: itens fora da lista de permissão: $extra"; exit 1; fi
          test -f _site/content/manifest.json
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
